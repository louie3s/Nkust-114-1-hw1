<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="ANSI">
    <title>空氣品質查詢系統</title>

    <!-- Bootstrap CSS（只用 CSS，不複雜） -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 頂部標題列 -->
    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">空氣品質查詢系統（PM2.5）</span>
        </div>
    </nav>

    <div class="container">

        <!-- 操作區 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body d-flex gap-3 align-items-center">
                <button class="btn btn-success" onclick="loadTop(10)">
                    查詢 PM2.5 前 10 名
                </button>

                <button class="btn btn-outline-success" onclick="loadTop(20)">
                    前 20 名
                </button>
            </div>
        </div>

        <!-- 結果表格 -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">查詢結果</h5>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-success">
                            <tr>
                                <th>測站</th>
                                <th>縣市</th>
                                <th>PM2.5</th>
                                <th>資料時間</th>
                            </tr>
                        </thead>
                        <tbody id="result">
                            <!-- JS 動態產生 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
